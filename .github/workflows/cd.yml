name: CD

on:
  push:
    branches:
      - main    # production
      - develop # staging

env:
  PROJECT_ID: project-56785728-c1d1-40d7-9cc
  REGION: asia-northeast1
  SERVICE: sales-report-system
  IMAGE: asia-northeast1-docker.pkg.dev/project-56785728-c1d1-40d7-9cc/sales-report-system/app

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} .
          docker push ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy to Cloud Run (staging)
        if: github.ref == 'refs/heads/develop'
        run: |
          make deploy TAG=${{ github.sha }}

      - name: Deploy to Cloud Run (production)
        if: github.ref == 'refs/heads/main'
        run: |
          make deploy-prod TAG=${{ github.sha }}
